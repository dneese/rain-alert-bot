name: Check Weather and Send Alerts

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync users from Serverless
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: node sync-users.js || true

      - name: Check Weather
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node check-weather.js
